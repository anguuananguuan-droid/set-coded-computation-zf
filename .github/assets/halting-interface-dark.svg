<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="260" viewBox="0 0 1024 260" role="img" aria-labelledby="title desc">
  <title id="title">Execution and internal satisfaction</title>
  <desc id="desc">For a well-formed machine P, finite symbol input x, and transitive ZF set model M, external halting is equivalent to satisfaction of the closed sentence halt_sentence(P,x).</desc>
  <g fill="none" stroke="#3d444d" stroke-width="1">
    <path d="M0 1H1024M0 259H1024"/>
    <rect x="28" y="78" width="420" height="108" rx="2"/>
    <rect x="576" y="78" width="420" height="108" rx="2"/>
  </g>
  <g fill="#a7afb9" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2">
    <text x="238" y="108" text-anchor="middle">EXTERNAL EXECUTION</text>
    <text x="786" y="108" text-anchor="middle">INTERNAL SATISFACTION</text>
  </g>
  <g fill="#f0f3f6" text-anchor="middle">
    <text x="512" y="43" font-family="Georgia, 'Times New Roman', serif" font-size="23">halt_sentence(P, x) ∈ formula,  arity = 0</text>
    <text x="238" y="151" font-family="Georgia, 'Times New Roman', serif" font-size="29">P halts on x</text>
    <text x="512" y="147" font-family="Georgia, 'Times New Roman', serif" font-size="40">⇔</text>
    <text x="786" y="151" font-family="Georgia, 'Times New Roman', serif" font-size="26">M ⊨ halt_sentence(P, x)</text>
  </g>
  <text x="512" y="229" fill="#a7afb9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16">P is a machine, x is a finite symbol list, M is a transitive ZF set model.</text>
</svg>
