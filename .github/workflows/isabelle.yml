name: "01  Isabelle/ZF"
run-name: "01  Isabelle/ZF proofs"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isabelle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check source and documentation
        run: python3 scripts/check_repository.py
      - name: Cache pinned dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-deps
          key: linux-isabelle2025-2-afp2026-02-06-${{ hashFiles('scripts/install-ci.sh') }}
      - name: Install Isabelle and AFP
        run: bash scripts/install-ci.sh "$GITHUB_WORKSPACE/.ci-deps"
      - name: Check independent computation session
        run: |
          set -o pipefail
          .ci-deps/Isabelle2025-2/bin/isabelle build -v -c -j 1 -o threads=2 -o timeout=1800 -D Turing_Machines_ZF/Core Set_Coded_Computation_ZF 2>&1 | tee "$RUNNER_TEMP/isabelle-core.log"
      - name: Register AFP
        run: .ci-deps/Isabelle2025-2/bin/isabelle components -u "$GITHUB_WORKSPACE/.ci-deps/afp-2026-02-06/thys"
      - name: Check all proofs
        run: |
          set -o pipefail
          .ci-deps/Isabelle2025-2/bin/isabelle build -v -j 1 -o threads=2 -o timeout=1800 -D . 2>&1 | tee "$RUNNER_TEMP/isabelle-build.log"
      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-luatex texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Build submission archive and proof document
        run: |
          set -o pipefail
          bash scripts/package-afp-entry.sh "$RUNNER_TEMP/Set_Coded_Halting_Invariance_ZF.tar.gz"
          mkdir -p "$RUNNER_TEMP/afp-entry"
          tar -xzf "$RUNNER_TEMP/Set_Coded_Halting_Invariance_ZF.tar.gz" -C "$RUNNER_TEMP/afp-entry"
          .ci-deps/Isabelle2025-2/bin/isabelle build -v -c -j 1 -o threads=2 -o timeout=1800 -o browser_info -o document=pdf -o 'document_variants=document:outline=/proof,/ML' -o "document_output=$RUNNER_TEMP/afp-document" -D "$RUNNER_TEMP/afp-entry/Set_Coded_Halting_Invariance_ZF" 2>&1 | tee "$RUNNER_TEMP/isabelle-submission.log"
          test -s "$RUNNER_TEMP/afp-document/document.pdf"
          test -s "$RUNNER_TEMP/afp-document/outline.pdf"
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isabelle-build-log
          path: |
            ${{ runner.temp }}/isabelle-core.log
            ${{ runner.temp }}/isabelle-build.log
            ${{ runner.temp }}/isabelle-submission.log
          if-no-files-found: ignore
      - name: Save submission
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: set-coded-halting-invariance-zf
          path: |
            ${{ runner.temp }}/Set_Coded_Halting_Invariance_ZF.tar.gz
            ${{ runner.temp }}/afp-document/document.pdf
            ${{ runner.temp }}/afp-document/outline.pdf
          if-no-files-found: error
